name: DiscClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    from: 0.0.4
  YbridOpus:
    url: https://github.com/vector-im/opus-swift
    from: 0.8.4
targets:
  DiscClient:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SwiftOGG
        product: SwiftOGG
      - package: YbridOpus
        product: YbridOpus
      - sdk: libbz2.tbd
      - framework: Vendor/SherpaOnnxC.xcframework
        embed: true
        codeSign: true
    configFiles:
      Debug: Vendor/dave-link.xcconfig
      Release: Vendor/dave-link.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: DiscClient-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.example.discclient
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DiscClient
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Распознавание речи нужно для субтитров голосового канала"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Сохранение фото, гифок и видео из чатов в галерею"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон нужен для голосовых сообщений и голосовых каналов"
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы показывать себя в голосовых каналах"
