name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Arrange sources
        run: |
          mkdir -p Sources
          mv *.swift Sources/
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project DiscClient.xcodeproj -scheme DiscClient -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DiscClient.app Payload/
          zip -qr DiscClient.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: DiscClient.ipa
