name: DiscClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '18.0'
packages:
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    from: 0.0.4
  YbridOpus:
    url: https://github.com/vector-im/opus-swift
    from: 0.8.4
targets:
  DiscClient:
    type: application
    platform: iOS
    sources:
    - path: Sources
      excludes:
      - SampleHandler.swift
      - StreamRecorder.swift
    dependencies:
    - package: SwiftOGG
      product: SwiftOGG
    - package: YbridOpus
      product: YbridOpus
    - sdk: libbz2.tbd
    - framework: Vendor/SherpaOnnxC.xcframework
      embed: true
      codeSign: true
    - target: BroadcastExtension
    configFiles:
      Debug: Vendor/dave-link.xcconfig
      Release: Vendor/dave-link.xcconfig
    settings:
      base:
        SWIFT_VERSION: '5.0'
        SWIFT_OBJC_BRIDGING_HEADER: DiscClient-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.example.discclient
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        # Авто-генерацию Info.plist выключаем: из-за неё Xcode выкидывал кастомные ключи
        # (ATS, URL-схема). Все ключи задаём явно ниже в info.properties.
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: DiscClient.entitlements
    info:
      path: DiscClient-Info.plist
      properties:
        CFBundleDisplayName: DiscClient
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
        - audio
        NSSpeechRecognitionUsageDescription: Распознавание речи нужно для субтитров голосового канала
        NSPhotoLibraryAddUsageDescription: Сохранение фото, гифок и видео из чатов в галерею
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых сообщений и голосовых каналов
        NSCameraUsageDescription: Камера нужна, чтобы показывать себя в голосовых каналах
        CFBundleURLTypes:
        - CFBundleURLSchemes:
          - discclient
        # Разрешаем обычный http:// — иначе iOS блокирует связь с сервером по IP без HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            195.14.118.91:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
    - path: Sources/SampleHandler.swift
    - path: Sources/LocalSocket.swift
    - path: Sources/BroadcastShared.swift
    settings:
      base:
        SWIFT_VERSION: '5.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.example.discclient.broadcast
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: 'YES'
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: DiscClient Stream
    info:
      path: BroadcastExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
