name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Arrange sources
        run: |
          mkdir -p Sources
          mv *.swift Sources/

      - name: Restore DAVE cache
        id: dave-cache
        uses: actions/cache@v4
        with:
          path: Vendor/dave
          key: dave-ios-v1-${{ hashFiles('build-dave.sh') }}

      - name: Build libdave (iOS)
        if: steps.dave-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash build-dave.sh

      - name: DAVE link config
        run: |
          mkdir -p Vendor
          if [ -f Vendor/dave/lib/libdave.a ]; then
            LIBS=""
            for f in Vendor/dave/lib/*.a; do
              n=$(basename "$f" .a)
              n=${n#lib}
              LIBS="$LIBS -l$n"
            done
            {
              echo 'HEADER_SEARCH_PATHS = $(inherited) $(SRCROOT)/Vendor/dave/include'
              echo "OTHER_LDFLAGS = \$(inherited) -L\$(SRCROOT)/Vendor/dave/lib$LIBS -lc++"
              echo 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) DAVE'
            } > Vendor/dave-link.xcconfig
            echo "### DAVE: библиотека собрана и подключена" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "// DAVE не собрана" > Vendor/dave-link.xcconfig
            echo "### DAVE: библиотека НЕ собрана, приложение соберётся без неё" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$RUNNER_TEMP/dave-build.log" ]; then
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 80 "$RUNNER_TEMP/dave-build.log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Fetch sherpa-onnx (Pocket TTS)
        run: bash fetch-sherpa.sh

      - name: Fetch sing-box (built-in VPN)
        run: bash fetch-singbox.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project DiscClient.xcodeproj -scheme DiscClient -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log

      - name: Build errors summary
        if: failure()
        run: |
          {
            echo "### Ошибки сборки приложения"
            echo '```'
            grep -E "error:" build.log | sort -u | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable background audio
        run: |
          PLIST="build/Build/Products/Release-iphoneos/DiscClient.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Сохранение фото, гифок и видео из чатов в галерею" "$PLIST"
          {
            echo "### Info.plist: фоновые режимы"
            echo '```'
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DiscClient.app Payload/
          zip -qr DiscClient.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: DiscClient.ipa
